		</br>
		
		<div class="main-content-box">
			<div class="content-box">
				<h2>Champion Stats</h2>
				<!-- Fix string augmentation with champions like Rek'Sai not being updated to reksai -->
				<p>
					<label for="champion">Champion:</label>
					<input id="champion" type="text" value="Aurelion_Sol" list="championNames" size="14">
				</p>

				<div class="champSearch">
					<div class="vsSearch">
						<a id="lolAlyticsLink" target="_blank" rel="noopener noreferrer">LoLAlytics</a>
						<label for="vsChampion">vs.</label>
						<input id="vsChampion" type="text" value="" list="championNames" size="14" title="Leave blank if you want non-matchup statisctics">
					</div>

					<ul>
						<li><p><a id="wikiLink" target="_blank" rel="noopener noreferrer">Champion Wiki</a></p></li>
						<li><p><a id="patchLink" target="_blank" rel="noopener noreferrer">Patch History</a></p></li>
						<li><p><a id="mayhemLink" target="_blank" rel="noopener noreferrer">MetaSrc Mayhem</a></p></li>
					</ul>
				</div>
				
				<script>
					const championInput = document.getElementById("champion");
					const vsChampionInput = document.getElementById("vsChampion");

					function updateLinks() {
						const name = championInput.value.trim();
						
						const metaSrcSlug = encodeURIComponent(
							name.toLowerCase().replace(/\./g, "").replace(/[\s_]+/g, "-")
						);

						const lolAlyticsSlug = encodeURIComponent(
							name.toLowerCase().replace(/[\s_]+/g, "")
						);
						
						const wikiName = encodeURIComponent(name.replace(/\s+/g, "_"));
						
						const vsChampion = vsChampionInput.value.trim();
						const vsChampSlug = encodeURIComponent(
							vsChampion.toLowerCase().replace(/[\s_]+/g, "")
						);

						document.getElementById("wikiLink").href =
							`https://wiki.leagueoflegends.com/en-us/${wikiName}`;

						document.getElementById("patchLink").href =
							`https://wiki.leagueoflegends.com/en-us/${wikiName}/Patch_history`;
							
						document.getElementById("lolAlyticsLink").href = vsChampion
							? `https://lolalytics.com/lol/${lolAlyticsSlug}/vs/${vsChampSlug}/build/`
							: `https://lolalytics.com/lol/${lolAlyticsSlug}/build/`;

						document.getElementById("mayhemLink").href =
							`https://www.metasrc.com/lol/mayhem/champions/${metaSrcSlug}/build`;
					}

					championInput.addEventListener("input", updateLinks);
					vsChampionInput.addEventListener("input", updateLinks);
					updateLinks();
				</script>
			</div>

			<div class="content-box">
				<h2>Summoner Stats</h2>
				<label for="trackerSite">Search on:</label>
				<select id="trackerSite">
					<option value="opgg">OP.GG</option>
					<option value="dpm">DPM LoL</option>
					<option value="leagueofgraphs">League of Graphs</option>
				</select>

				<ul id="accountLinks" class="accounts"></ul>

				<script>
					const accounts = [
						{ label: "GANK ON CS #FIORA", id: "GANK ON CS-Fiora", region: "na" },
						{ label: "THERE IS NO META #NA101", id: "THERE IS NO META-NA101", region: "na" },
						{ label: "CN FIORA FAN #GOD", id: "CN FIORA FAN-GOD", region: "na" },
						{ label: "Faker1 #666", id: "Faker 1-666", region: "na" },
						{ label: "Super 新手 #Faker", id: "Super 新手-Faker", region: "na" }
					];

					const trackerSite = document.getElementById("trackerSite");
					const accountLinks = document.getElementById("accountLinks");

					function getAccountUrl(site, account) {
						const id = encodeURIComponent(account.id);

						if (site === "dpm") {
							return `https://dpm.lol/${id}`;
						}

						if (site === "leagueofgraphs") {
							return `https://www.leagueofgraphs.com/summoner/${account.region}/${id}`;
						}

						return `https://op.gg/lol/summoners/${account.region}/${id}`;
					}

					function updateAccountLinks() {
						accountLinks.replaceChildren();

						for (const account of accounts) {
							const item = document.createElement("li");
							const link = document.createElement("a");

							link.href = getAccountUrl(trackerSite.value, account);
							link.textContent = account.label;
							link.target = "_blank";
							link.rel = "noopener noreferrer";

							item.appendChild(link);
							accountLinks.appendChild(item);
						}
					}

					trackerSite.addEventListener("change", updateAccountLinks);
					updateAccountLinks();
				</script>
			</div>
